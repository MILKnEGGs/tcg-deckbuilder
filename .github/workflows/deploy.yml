# Downloads fresh card data and TCGplayer prices, tests, builds every app and publishes to GitHub Pages.
# Runs on every push to main and once a day (after TCGCSV posts the day's prices, ~20:00 UTC).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Note: GitHub pauses scheduled runs after 60 days without a commit; it emails first, and one click re-enables them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # UniVersus attuned symbols come from UVS Ultra, a fan site we ask at most once a week:
      # keep the download between daily runs (uvsultra.mjs re-downloads once it's a week old).
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: apps/universus/scripts/uvsultra.json
          key: uvsultra-${{ steps.week.outputs.week }}
          restore-keys: uvsultra-
      - run: npm run data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
