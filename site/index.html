      :root { color-scheme: dark; }

        background: #0b0f1a;
        color: #e5e7eb;
        display: grid;
        place-items: center;
      }
      main { width: min(480px, calc(100% - 32px)); }

      a {
        display: block;

        border: 1px solid #263046;
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { border-color: #f5c542; }
